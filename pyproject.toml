[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ehl-alpha-parsing"
version = "0.1.0"
description = "Docling-based PDF parsing pipeline for LLM field extraction"
readme = "parsing/README.md"
requires-python = ">=3.11"
dependencies = [
  "docling>=2.137.0",
  "openai>=1.40.0",
  "python-dotenv>=1.0.0",
  "Pillow>=10.0.0",
  "pypdf>=5.0.0",
  "cryptography>=3.1",
  "requests>=2.32.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "reportlab>=4.0.0",
]

[project.scripts]
parse-document = "parsing.run:main"

[tool.setuptools.packages.find]
include = ["parsing*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
